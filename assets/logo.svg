<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jarvisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00ffc8"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer hexagon ring -->
  <path d="M256 40 L436 144 L436 368 L256 472 L76 368 L76 144 Z" 
        stroke="url(#jarvisGrad)" stroke-width="6" fill="none" opacity="0.4"/>
  
  <!-- Inner hexagon -->
  <path d="M256 90 L386 165 L386 347 L256 422 L126 347 L126 165 Z" 
        stroke="url(#jarvisGrad)" stroke-width="4" fill="none" opacity="0.7"/>
  
  <!-- Core hexagon -->
  <path d="M256 140 L336 186 L336 326 L256 372 L176 326 L176 186 Z" 
        stroke="url(#jarvisGrad)" stroke-width="3" fill="rgba(0,229,255,0.08)" filter="url(#glow)"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="18" fill="url(#jarvisGrad)" filter="url(#glow)"/>
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="28" stroke="url(#jarvisGrad)" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Crosshair lines -->
  <line x1="256" y1="210" x2="256" y2="240" stroke="url(#jarvisGrad)" stroke-width="2" opacity="0.8"/>
  <line x1="256" y1="272" x2="256" y2="302" stroke="url(#jarvisGrad)" stroke-width="2" opacity="0.8"/>
  <line x1="210" y1="256" x2="240" y2="256" stroke="url(#jarvisGrad)" stroke-width="2" opacity="0.8"/>
  <line x1="272" y1="256" x2="302" y2="256" stroke="url(#jarvisGrad)" stroke-width="2" opacity="0.8"/>
</svg>
