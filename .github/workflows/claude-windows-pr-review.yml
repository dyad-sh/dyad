name: Claude Windows PR Review

# Executes PR code on an ephemeral Windows runner for cross-platform review.

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, closed]

# Restrict default permissions; each job declares only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  windows-review:
    environment: ai-bots
    outputs:
      context_sha: ${{ steps.context.outputs.context_sha }}
    # Only review code from regular contributors since claude code has non-trivial costs.
    # This job intentionally executes PR code. The author allowlist is a trust
    # boundary, not a sandbox; it is narrower than the static reviewer's.
    # https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-filtered-authors.yml
    # A closed event cancels in-flight runs via concurrency without a new review.
    if: >-
      github.event.action != 'closed' &&
      contains(
        fromJSON('["wwwillchen","keppo-bot","keppo-bot[bot]","dyad-assistant","azizmejri1","ryangroch"]'),
        github.event.pull_request.user.login
      )
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      REVIEW_SOURCE_PATH: tmp/windows-pr-review/source
      REVIEW_CONTEXT_PATH: tmp/windows-pr-review/windows-context.json
      REVIEW_PROMPT_PATH: tmp/windows-pr-review/windows-prompt.txt
      REVIEW_OUTPUT_PATH: tmp/windows-pr-review/windows-review.md
      REVIEW_FINDINGS_PATH: tmp/windows-pr-review/windows-findings.json
    steps:
      - name: Checkout trusted workflow repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: v24.13.1

      - name: Build PR review context
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTPUT_PATH: ${{ env.REVIEW_CONTEXT_PATH }}
        run: node scripts/pr-review/build-context.mjs

      - name: Checkout exact PR head for Windows execution
        uses: actions/checkout@v5
        with:
          # This job intentionally executes code from allowlisted authors.
          allow-unsafe-pr-checkout: true
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: ${{ env.REVIEW_SOURCE_PATH }}

      - name: Verify context matches the checked-out PR head
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const review = JSON.parse(fs.readFileSync(process.env.REVIEW_CONTEXT_PATH, 'utf8'));
            const head = execFileSync('git', ['rev-parse', 'HEAD'], {
              cwd: process.env.REVIEW_SOURCE_PATH, encoding: 'utf8',
            }).trim();
            if (head !== review.pullRequest.headSha) {
              throw new Error('PR head changed while preparing review; rerun for the latest commit');
            }

      - name: Install npm 11.8.0
        run: npm install -g npm@11.8.0

      # Installation failures must not suppress the review. Claude can diagnose
      # them and run dependency-free reproductions; no proxy secrets are set here.
      - name: Install PR dependencies
        id: dependencies
        continue-on-error: true
        working-directory: ${{ env.REVIEW_SOURCE_PATH }}
        run: npm ci --no-audit --no-fund

      - name: Prepare test server dependencies
        id: test-server
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ env.REVIEW_SOURCE_PATH }}/testing/fake-llm-server
        run: npm ci --no-audit --no-fund && npm run build

      - name: Render Claude review prompt
        id: render-prompt
        env:
          TEMPLATE_PATH: .github/prompts/claude-windows-pr-review.txt
          OUTPUT_PATH: ${{ env.REVIEW_PROMPT_PATH }}
          OUTPUT_NAME: prompt
          CONTEXT_PATH: ${{ env.REVIEW_CONTEXT_PATH }}
          SOURCE_PATH: ${{ env.REVIEW_SOURCE_PATH }}
          INSTALL_OUTCOME: ${{ steps.dependencies.outcome }}
          TEST_SERVER_OUTCOME: ${{ steps.test-server.outcome }}
          OUTPUT_MD_PATH: ${{ env.REVIEW_OUTPUT_PATH }}
          OUTPUT_FINDINGS_PATH: ${{ env.REVIEW_FINDINGS_PATH }}
        run: node scripts/issue-agent/render-template.mjs

      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-dyad

      - name: PR Review
        # This commit bundles Claude Code 2.1.280, required by claude-opus-5-5.
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # post-v1.0.231
        env:
          ANTHROPIC_BASE_URL: http://100.73.172.24:8081
          # Default is 32,000 which Claude willl sometimes hit.
          # https://code.claude.com/docs/en/settings
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: 48000
        with:
          anthropic_api_key: ${{ secrets.UNDERCLASS_KEY }}

          # See: https://github.com/anthropics/claude-code-action/blob/v1/docs/security.md
          github_token: ${{ github.token }}
          allowed_non_write_users: "ryangroch" # remember, we already filter above.
          allowed_bots: "keppo-bot[bot]"

          # Disable progress tracking (try to save tokens)
          track_progress: false
          display_report: false

          prompt: ${{ steps.render-prompt.outputs.prompt }}

          # Execution and scratch edits are intentional. Ignore project/local
          # settings (including PR hooks); GitHub writes happen only in the next job.
          claude_args: |
            --model claude-opus-5-5
            --setting-sources user
            --allowedTools "Read,Glob,Grep,Bash,Edit,Write"

      - name: Verify Claude review outputs
        run: |
          if [[ ! -s "$REVIEW_OUTPUT_PATH" ]]; then
            echo "::error::Claude did not write $REVIEW_OUTPUT_PATH"
            exit 1
          fi
          if [[ ! -s "$REVIEW_FINDINGS_PATH" ]]; then
            echo "::error::Claude did not write $REVIEW_FINDINGS_PATH"
            exit 1
          fi

      - name: Upload Claude review artifact
        uses: actions/upload-artifact@v6
        with:
          name: claude-windows-pr-review
          path: |
            ${{ env.REVIEW_CONTEXT_PATH }}
            ${{ env.REVIEW_OUTPUT_PATH }}
            ${{ env.REVIEW_FINDINGS_PATH }}
          if-no-files-found: error
          retention-days: 1

  post-windows-review:
    environment: ai-bots
    needs: windows-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      REVIEW_CONTEXT_PATH: tmp/windows-pr-review/windows-context.json
      REVIEW_OUTPUT_PATH: tmp/windows-pr-review/windows-review.md
      REVIEW_FINDINGS_PATH: tmp/windows-pr-review/windows-findings.json
    steps:
      - name: Download Claude review artifact
        uses: actions/download-artifact@v7
        with:
          name: claude-windows-pr-review
          path: tmp/windows-pr-review

      - name: Refresh trusted post-agent helpers
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: tmp/windows-pr-review/trusted-post-agent

      - name: Validate Claude review summary
        env:
          CONTEXT_PATH: ${{ env.REVIEW_CONTEXT_PATH }}
          REVIEW_PATH: ${{ env.REVIEW_OUTPUT_PATH }}
          EXPECTED_CONTEXT_SHA: ${{ needs.windows-review.outputs.context_sha }}
        run: node tmp/windows-pr-review/trusted-post-agent/scripts/pr-review/validate-review-summary.mjs

      - name: Validate Claude findings
        id: validate-findings
        continue-on-error: true
        env:
          CONTEXT_PATH: ${{ env.REVIEW_CONTEXT_PATH }}
          REVIEW_PATH: ${{ env.REVIEW_OUTPUT_PATH }}
          FINDINGS_PATH: ${{ env.REVIEW_FINDINGS_PATH }}
          EXPECTED_CONTEXT_SHA: ${{ needs.windows-review.outputs.context_sha }}
        run: node tmp/windows-pr-review/trusted-post-agent/scripts/pr-review/validate-review.mjs

      - name: Warn when Claude findings validation fails
        if: ${{ steps.validate-findings.outcome == 'failure' }}
        run: |
          echo "::warning::Claude findings validation failed; skipped inline comments."
          echo "Claude findings validation failed; skipped inline comments." >> "$GITHUB_STEP_SUMMARY"

      - name: Create fresh post-review token
        id: post-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DYAD_GITHUB_APP_ID }}
          private-key: ${{ secrets.DYAD_GITHUB_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write

      - name: Post Claude inline review comments
        id: post-inline
        if: ${{ steps.validate-findings.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.post-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONTEXT_PATH: ${{ env.REVIEW_CONTEXT_PATH }}
          FINDINGS_PATH: ${{ env.REVIEW_FINDINGS_PATH }}
          REVIEW_LABEL: Claude Windows
        run: node tmp/windows-pr-review/trusted-post-agent/scripts/pr-review/post-inline-review.mjs

      - name: Warn when Claude inline posting fails
        if: ${{ steps.post-inline.outcome == 'failure' }}
        run: |
          echo "::warning::Claude inline comment posting failed; summary comment still posted."
          echo "Claude inline comment posting failed; summary comment still posted." >> "$GITHUB_STEP_SUMMARY"

      - name: Post Claude review comment
        if: ${{ always() && steps.post-token.outcome == 'success' }}
        uses: actions/github-script@v8
        env:
          REVIEW_PATH: ${{ env.REVIEW_OUTPUT_PATH }}
        with:
          github-token: ${{ steps.post-token.outputs.token }}
          script: |
            const fs = require('node:fs');

            const reviewPath = process.env.REVIEW_PATH;
            if (!reviewPath) {
              throw new Error('REVIEW_PATH is required');
            }

            const summary = fs.readFileSync(reviewPath, 'utf8').trim();
            if (!summary) {
              throw new Error('Validated Claude review is missing summary text');
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const body = [
              '<!-- pr-review:claude-windows -->',
              '## :window: Dyadbot Windows Compatibility Review',
              '',
              summary,
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
            core.info('Created Claude Windows review comment');
