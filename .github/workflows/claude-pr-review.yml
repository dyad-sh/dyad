name: Claude PR Review

# https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

# Restrict default permissions; each job declares only what it needs.
permissions: {}

concurrency:
  # Unrelated/unauthorized comments must not cancel an active review.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.comment.id }}
  cancel-in-progress: true

jobs:
  review-request:
    # Ordinary PR events retain the author allowlist. Comment requests are
    # authorized against the commenter's current repository permission below.
    if: >-
      (github.event_name == 'pull_request_target' &&
        contains(
          fromJSON('["wwwillchen","keppo-bot","keppo-bot[bot]","dyad-assistant","azizmejri1","princeaden1","nourzakhama2003","ryangroch"]'),
          github.event.pull_request.user.login
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@dyad-assistant')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.authorize.outputs.pr_number }}
    steps:
      - name: Checkout trusted authorization helper
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authorize review request
        id: authorize
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const { authorizeReviewComment } = await import(
                '${{ github.workspace }}/scripts/pr-review/authorize-review-comment.mjs'
              );
              const number = await authorizeReviewComment({ github, context });
              if (number !== null) core.setOutput('pr_number', String(number));
            } else {
              core.setOutput('pr_number', String(context.payload.pull_request.number));
            }

  run-review:
    needs: review-request
    if: needs.review-request.outputs.pr_number != ''
    # Share one lock across automatic and manual requests, but acquire it only
    # after authorization. It covers review AND posting in the called workflow.
    concurrency:
      group: claude-pr-review-execution-${{ github.repository }}-${{ needs.review-request.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: ./.github/workflows/claude-pr-review-run.yml
    with:
      pr_number: ${{ needs.review-request.outputs.pr_number }}
    secrets: inherit
